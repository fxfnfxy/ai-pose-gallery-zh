name: Sync upstream and build NAS site

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pose-sync
  cancel-in-progress: false

jobs:
  sync-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/anhao/ai-pose-gallery-zh.git
          git fetch upstream main
          BEFORE=$(git rev-parse HEAD)
          if git merge --no-edit upstream/main; then
            git push origin main
            echo "SYNC=OK before=$BEFORE after=$(git rev-parse HEAD)"
          else
            echo "SYNC=CONFLICT - 需要人工解决"
            git merge --abort || true
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Patch asset paths to /pose/
        run: |
          python3 - <<'PY'
          from pathlib import Path
          SEG = "/pose/"
          def rw(p, pairs):
              if not p.exists(): return
              t = p.read_text(encoding="utf-8"); n = t
              for a,b in pairs: n = n.replace(a,b)
              if n != t: p.write_text(n, encoding="utf-8")
          rw(Path("src/api/gallery.ts"), [("'/data/", "'"+SEG+"data/"), ('"/data/', '"'+SEG+"data/")])
          rw(Path("src/lib/recipeImages.ts"), [("? src : `/${src}`", "? src : `"+SEG+"${src}`")])
          for r in ["index.tsx","poses.tsx","costumes.tsx","portraits.tsx","studio.tsx"]:
              p = Path("src/routes")/r
              if p.exists():
                  t = p.read_text(encoding="utf-8")
                  n = t.replace("src={`/${", "src={`"+SEG+"${").replace("href={`/${","href={`"+SEG+"${")
                  if n != t: p.write_text(n, encoding="utf-8")
          vp = Path("vite.config.ts")
          if vp.exists():
              t = vp.read_text(encoding="utf-8")
              if "base:" not in t:
                  t = t.replace("export default defineConfig({", "export default defineConfig({\n  base: '/pose/',")
                  vp.write_text(t, encoding="utf-8")
          print("patched")
          PY

      - name: Build site
        run: |
          pnpm exec vite build
          echo "dist files: $(find dist -type f | wc -l)"

      - name: Prepare deploy artifact
        run: |
          rm -rf _deploy && mkdir -p _deploy
          cp -r dist/. _deploy/
          cp -r data _deploy/data
          cd _deploy && tar -czf ../site.tar.gz . && cd ..
          ls -lh site.tar.gz

      - name: Publish artifact to pose-deploy branch
        run: |
          sha=$(git rev-parse HEAD | cut -c1-12)
          PUB_DIR=$(mktemp -d)
          cp site.tar.gz "$PUB_DIR/"
          echo "$sha" > "$PUB_DIR/VERSION"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$PUB_DIR/BUILD_TIME"
          echo "https://github.com/fxfnfxy/ai-pose-gallery-zh/actions/runs/$GITHUB_RUN_ID" > "$PUB_DIR/SOURCE"
          cd "$PUB_DIR"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "deploy $sha"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/fxfnfxy/ai-pose-gallery-zh.git" HEAD:pose-deploy
          echo "published pose-deploy $sha"
